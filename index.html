<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Line Predictor for Kids</title>
</head>
<body>
  <h2>Line Predictor</h2>

  <p><strong>Step 1: Enter your training data (separated by commas)</strong></p>
  <label>X values (e.g. temperatures):</label><br>
  <input type="text" id="xValues" value="1, 2, 3, 4, 5"><br><br>

  <label>Y values (e.g. ice cream sales):</label><br>
  <input type="text" id="yValues" value="2, 3, 5, 6, 8"><br><br>

  <button id="fitBtn">Find the Trend</button>
  <p id="fitResult"></p>

  <hr>

  <p><strong>Step 2: Make a Smart Guess</strong></p>
  <label>Predict Y for X = </label>
  <input type="number" id="predictX" value="6">
  <button id="predictBtn">Predict!</button>

  <p id="predictionResult"></p>

  <!-- Notice type="module" -->
  <script type="module" src="main.js"></script>
</body>
</html>
